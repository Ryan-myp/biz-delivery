name: biz-delivery CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest scripts/test_core_functions.py -v
          pytest scripts/test_e2e.py -v
      
      - name: Check code quality
        run: |
          pylint scripts/ --disable=C0114,C0115,C0116
          flake8 scripts/
