name: biz-delivery CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install tree-sitter tree-sitter-go
      
      - name: Run tests
        run: |
          python -m pytest scripts/test_core_functions.py scripts/test_e2e.py scripts/test_workflows.py -v
      
      - name: Check code coverage
        run: |
          pip install coverage
          coverage run -m pytest scripts/
          coverage report --fail-under=80

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run flake8
        run: |
          pip install flake8
          flake8 scripts/ --max-line-length=120
      
      - name: Run mypy
        run: |
          pip install mypy
          mypy scripts/ --ignore-missing-imports
