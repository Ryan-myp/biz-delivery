<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>biz-delivery v4.2-debug</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-hover: #30363d;
      --border: #30363d;
      --border-light: #484f58;
      --text-primary: #f0f6fc;
      --text-secondary: #c9d1d9;
      --text-tertiary: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
      --warn: #d29922;
      --error: #f85149;
      --purple: #a371f7;
      --cyan: #39d353;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --radius: 8px;
      --radius-sm: 4px;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
    }
    
    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      height: 100vh;
      gap: 1px;
      background: var(--border);
    }
    
    /* ── Sidebar ── */
    .sidebar {
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    
    .logo-version {
      font-size: 10px;
      color: var(--text-tertiary);
      font-weight: 500;
      margin-left: auto;
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 10px;
    }
    
    .sidebar-actions {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .btn-new {
      width: 100%;
      padding: 8px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    
    .btn-new:hover { background: var(--accent-hover); transform: translateY(-1px); }
    
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-track { background: transparent; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }
    
    .project-group { margin-bottom: 8px; }
    
    .project-header {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .task-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.1s;
      margin-bottom: 2px;
    }
    
    .task-item:hover { background: var(--bg-hover); }
    .task-item.active { background: var(--bg-tertiary); border-left: 2px solid var(--accent); }
    
    .task-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .task-meta {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .task-status {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .task-status.running { background: var(--warn); animation: pulse 1.5s infinite; }
    .task-status.done { background: var(--success); }
    .task-status.idle { background: var(--text-tertiary); }
    
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    
    /* ── Main Content ── */
    .main {
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .topbar {
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    
    .topbar-left { display: flex; flex-direction: column; gap: 2px; }
    .topbar-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .topbar-sub { font-size: 11px; color: var(--text-tertiary); }
    
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .model-badge {
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
    }
    
    .btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .btn:hover { border-color: var(--border-light); color: var(--text-primary); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { color: var(--error); }
    .btn-danger:hover { border-color: var(--error); background: rgba(248,81,73,0.1); }
    
    /* ── Stage Tabs ── */
    .stage-tabs {
      display: flex;
      gap: 4px;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    
    .stage-tab {
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      white-space: nowrap;
      transition: all 0.15s;
    }
    
    .stage-tab:hover { border-color: var(--accent); color: var(--accent); }
    .stage-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .stage-tab.done { background: rgba(63,185,80,0.15); color: var(--success); border-color: var(--success); }
    
    /* ── Chat Area ── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    
    .msg {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }
    
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    
    .msg.user { flex-direction: row-reverse; margin-left: auto; }
    .msg.system { max-width: 100%; justify-content: center; }
    
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    .msg.assistant .avatar {
      background: linear-gradient(135deg, var(--accent), var(--purple));
      box-shadow: 0 2px 8px rgba(88,166,255,0.3);
    }
    
    .msg.user .avatar { background: var(--bg-tertiary); border: 1px solid var(--border); }
    .msg.system .avatar { background: none; font-size: 11px; color: var(--text-tertiary); }
    
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .msg.assistant .bubble {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    
    .msg.user .bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .msg.system .bubble {
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 11px;
      text-align: center;
      padding: 4px;
    }
    
    .bubble .stage-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: rgba(88,166,255,0.15);
      color: var(--accent);
    }
    
    .bubble .action-row {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .bubble .action-btn {
      font-size: 11px;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .bubble .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .bubble .action-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-tertiary);
    }
    
    .empty-state .big-icon {
      font-size: 56px;
      margin-bottom: 20px;
      opacity: 0.6;
    }
    
    .empty-state h3 {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    
    .empty-state p { font-size: 13px; }
    
    /* ── Input Area ── */
    .chat-input-area {
      padding: 16px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }
    
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    
    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      font-family: inherit;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      transition: all 0.15s;
    }
    
    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.1);
    }
    
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    
    .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    
    /* ── Right Panel ── */
    .right-panel {
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .panel-tabs {
      display: flex;
      gap: 2px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    
    .panel-tab {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-tertiary);
      white-space: nowrap;
      transition: all 0.15s;
    }
    
    .panel-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
    .panel-tab.active { background: var(--accent); color: white; }
    
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }
    
    /* ── Workflow Panel ── */
    .workflow-stage {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .workflow-stage:hover { background: var(--bg-hover); }
    .workflow-stage.active { background: rgba(88,166,255,0.1); border-left: 2px solid var(--accent); }
    .workflow-stage.done { opacity: 0.7; }
    
    .stage-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .workflow-stage.pending .stage-icon { background: var(--bg-tertiary); color: var(--text-tertiary); }
    .workflow-stage.running .stage-icon { background: rgba(210,153,34,0.2); color: var(--warn); animation: spin 1s linear infinite; }
    .workflow-stage.done .stage-icon { background: rgba(63,185,80,0.2); color: var(--success); }
    
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    
    .stage-info { flex: 1; min-width: 0; }
    .stage-name { font-size: 12px; font-weight: 500; color: var(--text-primary); }
    .stage-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
    
    .stage-arrow { color: var(--text-tertiary); font-size: 10px; }
    
    /* ── Memory Panel ── */
    .memory-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .memory-stats { display: flex; gap: 12px; }
    .stat { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
    
    .memory-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      background: var(--bg-tertiary);
      border-left: 3px solid var(--accent);
    }
    
    .memory-item.preference { border-left-color: var(--purple); }
    .memory-item.fact { border-left-color: var(--success); }
    .memory-item.decision { border-left-color: var(--warn); }
    .memory-item.context { border-left-color: var(--text-tertiary); }
    
    .memory-type {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    
    .memory-item.preference .memory-type { color: var(--purple); }
    .memory-item.fact .memory-type { color: var(--success); }
    .memory-item.decision .memory-type { color: var(--warn); }
    .memory-item.context .memory-type { color: var(--text-tertiary); }
    
    .memory-content { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .memory-tags { font-size: 10px; color: var(--text-tertiary); margin-top: 6px; }
    
    /* ── Context Panel ── */
    .token-meter {
      background: var(--bg-tertiary);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    
    .meter-bar {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .meter-fill {
      height: 100%;
      background: var(--success);
      border-radius: 3px;
      transition: width 0.3s;
    }
    
    .meter-fill.warn { background: var(--warn); }
    .meter-fill.error { background: var(--error); }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-tertiary); }
    .info-value { color: var(--text-primary); font-weight: 500; }
    
    /* ── MCP Panel ── */
    .mcp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .mcp-server { font-size: 12px; font-weight: 600; color: var(--accent); }
    .mcp-badge { font-size: 10px; background: var(--bg-tertiary); padding: 2px 8px; border-radius: 10px; color: var(--text-tertiary); }
    
    .mcp-tool-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    
    .mcp-tool-name { font-size: 12px; font-weight: 500; color: var(--text-primary); flex: 1; }
    .mcp-tool-desc { font-size: 11px; color: var(--text-tertiary); }
    
    /* ── Models Panel ── */
    .models-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .model-select {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 11px;
    }
    
    .model-item {
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius);
      margin-bottom: 8px;
    }
    
    .model-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .model-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .model-provider { font-size: 11px; color: var(--text-tertiary); }
    .model-cost { font-size: 11px; color: var(--success); }
    
    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    
    .stat-label { color: var(--text-tertiary); width: 30px; }
    .stat-bar { flex: 1; height: 4px; background: var(--bg-primary); border-radius: 2px; overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 2px; }
    .stat-val { color: var(--text-secondary); width: 24px; text-align: right; }
    
    /* ── Wiki Panel ── */
    .wiki-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .wiki-badge { font-size: 10px; background: var(--bg-tertiary); padding: 2px 8px; border-radius: 10px; color: var(--text-tertiary); }
    
    .wiki-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .wiki-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
    }
    
    .wiki-input:focus { outline: none; border-color: var(--accent); }
    
    .wiki-result-item {
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      border-left: 2px solid var(--accent);
    }
    
    .wiki-result-id { font-size: 10px; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
    .wiki-result-score { font-size: 10px; color: var(--text-tertiary); }
    
    /* ── Buttons ── */
    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger:hover { border-color: var(--error); color: var(--error); }
    
    /* ── Utility ── */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    
    .empty-memory, .empty-state-sm {
      text-align: center;
      padding: 20px;
      color: var(--text-tertiary);
      font-size: 12px;
    }
    
    .hidden { display: none !important; }
    
    /* ── Loading ── */
    .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    
    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .app { grid-template-columns: 200px 1fr 280px; }
    }
    
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar, .right-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ═══ Left Sidebar ═══ -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🚀</div>
          <span>biz-delivery</span>
          <span class="logo-version">v4.2</span>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn-new" onclick="showNewTaskModal()">
          <span>+</span> 新建任务
        </button>
      </div>
      <div class="sidebar-body" id="task-list"></div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-title" id="top-title">新建任务</div>
          <div class="topbar-sub" id="top-sub">在左侧创建或选择任务开始</div>
        </div>
        <div class="topbar-right" id="top-actions"></div>
      </div>
      
      <div class="stage-tabs" id="stage-tabs"></div>
      
      <div class="chat-wrap">
        <div class="chat-messages" id="chat-messages">
          <div class="empty-state">
            <div class="big-icon">💬</div>
            <h3>开始智能交付</h3>
            <p>选择一个任务，或与 AI 助手对话</p>
          </div>
        </div>
        <div class="chat-input-area">
          <div class="input-row">
            <textarea class="chat-input" id="chat-in" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
          </div>
        </div>
      </div>
    </main>

    <!-- ═══ Right Panel ═══ -->
    <aside class="right-panel">
      <div class="panel-header">
        <span id="panel-title">详情</span>
      </div>
      <div class="panel-tabs">
        <button class="panel-tab active" onclick="switchRightTab('workflow')">流程</button>
        <button class="panel-tab" onclick="switchRightTab('memory')">记忆</button>
        <button class="panel-tab" onclick="switchRightTab('context')">上下文</button>
        <button class="panel-tab" onclick="switchRightTab('mcp')">MCP</button>
        <button class="panel-tab" onclick="switchRightTab('models')">模型</button>
        <button class="panel-tab" onclick="switchRightTab('wiki')">Wiki</button>
      </div>
      <div class="panel-body" id="panel-body">
        <div class="empty-state" style="padding:40px 10px;">
          <div class="big-icon" style="font-size:32px;">📋</div>
          <p style="font-size:12px;">选择一个任务查看详情</p>
        </div>
      </div>
    </aside>
  </div>

<script>
// Immediate test
(function() {
  try {
    if (typeof document === 'undefined') return;
    console.log('Page loaded, DOM accessible');
    console.log('window._jsTest = true');
    window._jsTest = true;
  } catch(e) {
    console.error('Immediate test failed:', e);
  }
})();

// Global error handler
window.onerror = function(msg, url, line, col, err) {
  console.error('Global error:', msg, 'Line:', line);
  return false;
};

// ═══ Global State ═══

let activeTask = null;
let currentStage = '';
const STAGES = ['learn', 'review', 'td', 'agent', 'test', 'automation'];
const STAGE_NAMES = { learn:'知识提取', review:'PRD审查', td:'技术方案', agent:'代码执行', test:'测试用例', automation:'自动化' };

// ═══ API Helper ═══
async function api(path, opts={}) {
  const res = await fetch(path, {
    headers: {'Content-Type': 'application/json'},
    ...opts,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function setLoading(loading) {
  document.getElementById('send-btn').disabled = loading;
  document.getElementById('send-btn').innerHTML = loading ? '<span class="loading"></span>' : '➤';
}

function esc(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ═══ Task List ═══
async function loadTaskList() {
  const projects = await api('/api/projects');
  const list = document.getElementById('task-list');
  
  if (projects.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:12px;">暂无任务<br><br>点击「新建任务」开始</div>';
    return;
  }
  
  let html = '';
  for (const proj of projects) {
    const taskArr = Object.values(proj.tasks || {});
    if (taskArr.length === 0) continue;
    html += `<div class="project-group">
      <div class="project-header">📁 ${esc(proj.name)}</div>`;
    for (const t of taskArr) {
      const prog = t.progress || {};
      const st = prog.percent >= 100 ? 'done' : (prog.percent > 0 ? 'running' : 'idle');
      html += `<div class="task-item ${activeTask?.id===t.id?'active':''}" data-project="${proj.id}" data-task="${t.id}" style="cursor:pointer;">
        <div class="task-name">${esc(t.name)}</div>
        <div class="task-meta">
          <span class="task-status ${st}"></span>
          <span>${prog.completed||0}/${prog.total||0} 阶段</span>
          <span style="margin-left:auto">${t.model_name?.split('-')[1]||'demo'}</span>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  list.innerHTML = html;
  
  // Add click handlers using event delegation
  list.addEventListener('click', (e) => {
    const item = e.target.closest('.task-item');
    if (item) {
      const projectId = item.dataset.project;
      const taskId = item.dataset.task;
      selectTask(projectId, taskId);
    }
  });
}
// ═══ Select Task ═══
async function selectTask(projectId, taskId) {
  window._currentProjectId = projectId;
  const tasks = await api(`/api/projects/${projectId}/tasks`);
  activeTask = tasks.find(t => t.id === taskId);
  
  document.getElementById('top-title').textContent = activeTask.name;
  const prog = activeTask.progress || {};
  document.getElementById('top-sub').textContent = 
    `${activeTask.model_name} · ${prog.completed}/${prog.total} 阶段 · ${prog.current_stage || '就绪'}`;
  document.getElementById('top-actions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="runCurrentStage()">▶ 执行当前阶段</button>
    <button class="btn btn-danger btn-sm" onclick="deleteTask()">🗑</button>`;
  
  renderStageTabs();
  renderChat();
  loadTaskList();
  switchRightTab('workflow');
}

// ═══ Stage Tabs ═══
function renderStageTabs() {
  if (!activeTask) return;
  const tabs = document.getElementById('stage-tabs');
  let html = '<button class="stage-tab active" onclick="setStage(\'\')">💬 对话</button>';
  for (const s of STAGES) {
    const rec = activeTask.stages?.[s] || {};
    const done = rec.status === 'completed';
    html += `<button class="stage-tab ${done?'done':''} ${currentStage===s&&!done?'active':''}" onclick="setStage('${s}')">${STAGE_NAMES[s]}</button>`;
  }
  tabs.innerHTML = html;
}

function setStage(s) {
  currentStage = s;
  renderStageTabs();
  switchRightTab('workflow');
}

// ═══ Chat ═══
function renderChat() {
  const wrap = document.getElementById('chat-messages');
  if (!activeTask || !activeTask.messages?.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="big-icon">💬</div><h3>开始智能交付</h3><p>选择一个任务，或与 AI 助手对话</p></div>';
    return;
  }
  wrap.innerHTML = activeTask.messages.map(m => `
    <div class="msg ${m.role}">
      <div class="avatar">${m.role==='user'?'👤':'🤖'}</div>
      <div class="bubble">
        ${m.stage?`<span class="stage-tag">${STAGE_NAMES[m.stage]||m.stage}</span>`:''}
        ${esc(m.content)}
      </div>
    </div>`).join('');
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('chat-in');
  const msg = input.value.trim();
  if (!msg || !activeTask) return;
  input.value = '';
  setLoading(true);
  
  const c = document.getElementById('chat-messages');
  c.innerHTML += `<div class="msg user"><div class="avatar">👤</div><div class="bubble">${esc(msg)}</div></div>`;
  c.scrollTop = c.scrollHeight;
  
  try {
    const r = await api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}/chat`, {
      method:'POST', body: JSON.stringify({message: msg, stage: currentStage || null})
    });
    c.innerHTML += `<div class="msg assistant"><div class="avatar">🤖</div><div class="bubble">${esc(r.reply)}</div></div>`;
    c.scrollTop = c.scrollHeight;
    refreshTask();
  } catch(e) {
    c.innerHTML += `<div class="msg system"><div class="bubble">错误: ${esc(e.message)}</div></div>`;
  }
  setLoading(false);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('chat-in')?.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  loadTaskList();
});

// ═══ Right Panel ═══
async function switchRightTab(tab) {
  document.querySelectorAll('.panel-tab').forEach((el, i) => {
    el.classList.toggle('active', 
      (tab==='workflow'&&i===0)||(tab==='memory'&&i===1)||(tab==='context'&&i===2)||
      (tab==='mcp'&&i===3)||(tab==='models'&&i===4)||(tab==='wiki'&&i===5)
    );
  });
  const panel = document.getElementById('panel-body');
  if (tab==='workflow') renderWorkflow();
  else if (tab==='memory') await loadMemoryPanel();
  else if (tab==='context') await loadContextPanel();
  else if (tab==='mcp') await loadMCPPanel();
  else if (tab==='models') await loadModelsPanel();
  else if (tab==='wiki') await loadWikiPanel();
}

async function renderWorkflow() {
  if (!activeTask) return;
  const panel = document.getElementById('panel-body');
  const stages = activeTask.stages || {};
  let html = '';
  
  for (let i=0; i<STAGES.length; i++) {
    const s = STAGES[i];
    const rec = stages[s] || {status:'pending'};
    const status = rec.status || 'pending';
    const icon = status==='completed'?'✓':(status==='running'?'⟳':'○');
    html += `<div class="workflow-stage ${status} ${status==='running'?'running':''}" onclick="runStage('${s}')">
      <div class="stage-icon">${icon}</div>
      <div class="stage-info">
        <div class="stage-name">${STAGE_NAMES[s]}</div>
        <div class="stage-desc">${rec.summary?.substring(0,40)||'待执行'}</div>
      </div>
      ${i<STAGES.length-1?'<div class="stage-arrow">↓</div>':''}
    </div>`;
  }
  panel.innerHTML = html;
}

async function runStage(stage) {
  if (!activeTask) return;
  setLoading(true);
  try {
    await api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}/run-stage`, {
      method:'POST', body: JSON.stringify({stage})
    });
    await refreshTask();
    renderWorkflow();
  } catch(e) { alert('执行失败: '+e.message); }
  setLoading(false);
}

async function loadMemoryPanel() {
  if (!activeTask||!window._currentProjectId) return;
  const panel = document.getElementById('panel-body');
  try {
    const data = await api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}/context`);
    const memories = data.memories||[];
    panel.innerHTML = `
      <div class="memory-header">
        <div class="memory-stats">
          <span class="stat">💾 ${data.memory_stats?.total||0} 条记忆</span>
          <span class="stat">📁 ${data.memory_stats?.by_task||0} 个任务</span>
        </div>
        <button class="btn-sm" onclick="showAddMemoryModal()">+ 添加</button>
      </div>
      <div class="memory-list">`;
    if (!memories.length) {
      panel.innerHTML += '<div class="empty-memory">暂无记忆<br><small style="color:var(--text-tertiary)">对话中会自动保存关键决策和偏好</small></div>';
    } else {
      for (const mem of memories) {
        panel.innerHTML += `<div class="memory-item ${mem.type}">
          <div class="memory-type">${mem.type}</div>
          <div class="memory-content">${esc(mem.content)}</div>
          ${mem.tags?.length?`<div class="memory-tags">#${mem.tags.join(' #')}</div>`:''}
        </div>`;
      }
    }
    panel.innerHTML += '</div>';
  } catch(e) { panel.innerHTML = `<div style="color:var(--error);padding:10px;">加载失败: ${esc(e.message)}</div>`; }
}

async function loadContextPanel() {
  if (!activeTask||!window._currentProjectId) return;
  const panel = document.getElementById('panel-body');
  try {
    const data = await api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}/context`);
    const stats = data.context_stats||{};
    const tokens = stats.total_tokens||0;
    const maxTokens = 8000;
    const percent = Math.min(100, Math.round(tokens/maxTokens*100));
    const color = percent>80?'error':(percent>50?'warn':'');
    panel.innerHTML = `
      <div class="token-meter">
        <div class="meter-label"><span>Token 使用</span><span style="color:var(--${color==='error'?'error':color==='warn'?'warn':'success'})">${tokens.toFixed(0)} / ${maxTokens}</span></div>
        <div class="meter-bar"><div class="meter-fill ${color}" style="width:${percent}%"></div></div>
      </div>
      <div class="info-row"><span class="info-label">消息数量</span><span class="info-value">${data.message_count||0}</span></div>
      <div class="info-row"><span class="info-label">已压缩</span><span class="info-value" style="color:var(--${stats.truncated?'warn':'success'})">${stats.truncated?'是':'否'}</span></div>
      <div class="info-row"><span class="info-label">记忆数量</span><span class="info-value">${data.memory_stats?.total||0}</span></div>
      <button class="btn btn-sm" style="width:100%;margin-top:12px;" onclick="compressContext()">🔄 手动压缩</button>`;
  } catch(e) { panel.innerHTML = `<div style="color:var(--error);padding:10px;">加载失败: ${esc(e.message)}</div>`; }
}

async function compressContext() {
  if (!activeTask||!window._currentProjectId) return;
  setLoading(true);
  try {
    await api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}/compress`, {method:'POST'});
    loadContextPanel();
    refreshTask();
  } catch(e) { alert('压缩失败: '+e.message); }
  setLoading(false);
}

async function loadMCPPanel() {
  const panel = document.getElementById('panel-body');
  try {
    const data = await api('/api/mcp/tools');
    const tools = data.tools||[];
    panel.innerHTML = `
      <div class="mcp-header">
        <span class="mcp-server">🔌 ${esc(data.server)}</span>
        <span class="mcp-badge">${tools.length} 工具</span>
      </div>
      <div style="margin-top:12px;">`;
    for (const t of tools) {
      panel.innerHTML += `<div class="mcp-tool-item">
        <div class="mcp-tool-name">${esc(t.name)}</div>
        <button class="btn-sm" onclick="testMCPTool('${esc(t.name)}')">测试</button>
      </div>`;
    }
    panel.innerHTML += '</div>';
  } catch(e) { panel.innerHTML = `<div style="color:var(--error);padding:10px;">加载失败: ${esc(e.message)}</div>`; }
}

async function testMCPTool(name) {
  setLoading(true);
  try {
    const result = await api('/api/mcp/call', {method:'POST', body: JSON.stringify({tool:name,args:{}})});
    alert(JSON.stringify(result, null, 2));
  } catch(e) { alert('调用失败: '+e.message); }
  setLoading(false);
}

async function loadModelsPanel() {
  const panel = document.getElementById('panel-body');
  try {
    const data = await api('/api/models');
    panel.innerHTML = `
      <div class="models-header">
        <span>🤖 可用模型</span>
        <select class="model-select" onchange="changeStrategy(this.value)">
          <option value="balanced" ${data.strategy==='balanced'?'selected':''}>平衡</option>
          <option value="best_quality" ${data.strategy==='best_quality'?'selected':''}>最佳质量</option>
          <option value="fastest" ${data.strategy==='fastest'?'selected':''}>最快</option>
          <option value="cheapest" ${data.strategy==='cheapest'?'selected':''}>最经济</option>
        </select>
      </div>
      <div style="margin-top:12px;">`;
    for (const m of data.models) {
      const cap = m.capabilities||{};
      panel.innerHTML += `<div class="model-item">
        <div class="model-info">
          <div><div class="model-name">${esc(m.name)}</div><div class="model-provider">${esc(m.provider)}</div></div>
          <div class="model-cost">$${(m.cost_per_token*1000000).toFixed(2)}/M</div>
        </div>
        <div class="stat-row"><span class="stat-label">代码</span><div class="stat-bar"><div class="stat-fill" style="width:${cap.code||0}%;background:var(--accent)"></div></div><span class="stat-val">${cap.code||0}</span></div>
        <div class="stat-row"><span class="stat-label">分析</span><div class="stat-bar"><div class="stat-fill" style="width:${cap.analysis||0}%;background:var(--success)"></div></div><span class="stat-val">${cap.analysis||0}</span></div>
        <div class="stat-row"><span class="stat-label">速度</span><div class="stat-bar"><div class="stat-fill" style="width:${cap.fast||0}%;background:var(--warn)"></div></div><span class="stat-val">${cap.fast||0}</span></div>
      </div>`;
    }
    panel.innerHTML += '</div>';
  } catch(e) { panel.innerHTML = `<div style="color:var(--error);padding:10px;">加载失败: ${esc(e.message)}</div>`; }
}

async function changeStrategy(s) {
  try {
    await api('/api/models/set-strategy', {method:'POST', body: JSON.stringify({strategy:s})});
    loadModelsPanel();
  } catch(e) { alert('切换失败: '+e.message); }
}

async function loadWikiPanel() {
  const panel = document.getElementById('panel-body');
  try {
    const stats = await api('/api/wiki/stats');
    panel.innerHTML = `
      <div class="wiki-header">
        <span>📚 LLM Wiki</span>
        <span class="wiki-badge">${stats.total_entries||0} 条目</span>
      </div>
      <div style="margin-top:12px;">
        <div class="info-row"><span class="info-label">知识节点</span><span class="info-value">${stats.total_nodes||0}</span></div>
        <div class="info-row"><span class="info-label">索引大小</span><span class="info-value">${stats.index_size||0}</span></div>
      </div>
      <div style="margin-top:16px;">
        <div class="section-title">🔍 查询知识库</div>
        <div class="wiki-input-row">
          <input type="text" class="wiki-input" id="wiki-query" placeholder="输入问题...">
          <button class="btn-sm" onclick="searchWiki()">查询</button>
        </div>
        <div id="wiki-results" style="margin-top:8px;"></div>
      </div>
      <div style="margin-top:20px;">
        <div class="section-title">⚙️ 重建知识库</div>
        <div class="wiki-input-row">
          <select class="wiki-input" id="wiki-lang" style="flex:0 0 80px;">
            <option value="python">Python</option>
            <option value="go">Go</option>
            <option value="java">Java</option>
          </select>
          <button class="btn-sm" onclick="buildWiki()">🔄 重建</button>
        </div>
      </div>`;
  } catch(e) { panel.innerHTML = `<div style="color:var(--error);padding:10px;">加载失败: ${esc(e.message)}</div>`; }
}

async function searchWiki() {
  const query = document.getElementById('wiki-query').value.trim();
  if (!query) return;
  const r = document.getElementById('wiki-results');
  r.innerHTML = '<div style="color:var(--text-tertiary);font-size:11px;">搜索中...</div>';
  try {
    const result = await api('/api/wiki/query', {method:'POST', body: JSON.stringify({question:query,top_k:5})});
    if (!result.results.length) { r.innerHTML = '<div style="color:var(--text-tertiary);font-size:11px;margin-top:8px;">未找到相关知识点</div>'; return; }
    r.innerHTML = result.results.map(r=>`<div class="wiki-result-item">
      <div style="display:flex;justify-content:space-between;"><span class="wiki-result-id">${r.id}</span><span class="wiki-result-score">${r.score.toFixed(3)}</span></div>
    </div>`).join('');
  } catch(e) { r.innerHTML = `<div style="color:var(--error);font-size:11px;margin-top:8px;">搜索失败: ${esc(e.message)}</div>`; }
}

async function buildWiki() {
  const lang = document.getElementById('wiki-lang').value;
  setLoading(true);
  try {
    const result = await api('/api/wiki/build', {method:'POST', body: JSON.stringify({repo_path:'.',language:lang})});
    alert(`✅ 知识库重建完成！\n- 知识条目: ${result.total_entries}\n- 源文件数: ${result.total_files}`);
    loadWikiPanel();
  } catch(e) { alert('重建失败: '+e.message); }
  setLoading(false);
}

// ═══ Task Actions ═══
async function refreshTask() {
  if (!activeTask||!window._currentProjectId) return;
  const tasks = await api(`/api/projects/${window._currentProjectId}/tasks`);
  activeTask = tasks.find(t=>t.id===activeTask.id);
  renderStageTabs();
  renderChat();
  loadTaskList();
  if (document.getElementById('panel-body')) {
    const activeTab = document.querySelector('.panel-tab.active')?.textContent||'';
    if (activeTab.includes('流程')) renderWorkflow();
  }
}

function runCurrentStage() {
  if (!activeTask) return;
  const next = STAGES.find(s => !(activeTask.stages?.[s]?.status==='completed'));
  if (next) runStage(next);
  else alert('所有阶段已完成');
}

async function deleteTask() {
  if (!confirm('确定删除此任务？')) return;
  await api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}`, {method:'DELETE'});
  activeTask = null;
  document.getElementById('top-title').textContent = '新建任务';
  document.getElementById('top-sub').textContent = '在左侧创建或选择任务开始';
  document.getElementById('top-actions').innerHTML = '';
  document.getElementById('chat-messages').innerHTML = '<div class="empty-state"><div class="big-icon">💬</div><h3>开始智能交付</h3><p>选择一个任务，或与 AI 助手对话</p></div>';
  loadTaskList();
}

// ═══ New Task Modal ═══
function showNewTaskModal() {
  const name = prompt('任务名称:');
  if (!name) return;
  const prd = prompt('PRD 内容（可选）:','')||'';
  const profile = prompt('Profile（default/test-multi-repo/ad-platform）:','default')||'default';
  setLoading(true);
  api('/api/projects', {method:'POST', body: JSON.stringify({name:'默认项目'})})
    .then(async proj => {
      await api(`/api/projects/${proj.id}/tasks`, {method:'POST', body: JSON.stringify({name,prd_text:prd,profile_path:`profiles/${profile}.json`})});
      await loadTaskList();
    })
    .catch(e => alert('创建失败: '+e.message))
    .finally(()=>setLoading(false));
}

function showAddMemoryModal() {
  const content = prompt('输入记忆内容:');
  if (!content) return;
  const type = prompt('类型 (preference/fact/decision/context):','fact')||'fact';
  api(`/api/projects/${window._currentProjectId}/tasks/${activeTask.id}/memory`, {
    method:'POST', body: JSON.stringify({type,content,tags:[]})
  }).then(()=>loadMemoryPanel()).catch(e=>alert('添加失败: '+e.message));
}
