<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>biz-delivery v3.0</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
      --border: #334155; --text: #f1f5f9; --text2: #94a3b8;
      --primary: #3b82f6; --success: #22c55e; --warn: #f59e0b; --err: #ef4444;
      --r: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    
    .app { display: grid; grid-template-columns: 220px 1fr 320px; height: 100vh; }
    
    /* Sidebar */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 16px; font-weight: 700; }
    .sidebar-header .ver { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .sidebar-stages { flex: 1; padding: 12px; }
    .stage-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; color: var(--text2); transition: all 0.15s; font-size: 13px; }
    .stage-item:hover { background: var(--surface2); color: var(--text); }
    .stage-item.active { background: var(--primary); color: white; }
    .stage-item.done { color: var(--success); }
    .stage-item.err { color: var(--err); }
    .stage-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); flex-shrink: 0; }
    .stage-item.active .stage-dot { background: white; animation: pulse 2s infinite; }
    .stage-item.done .stage-dot { background: var(--success); }
    .stage-item.err .stage-dot { background: var(--err); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
    .model-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); background: var(--surface2); padding: 6px 10px; border-radius: var(--r); }
    
    /* Main */
    .main { display: flex; flex-direction: column; overflow: hidden; }
    .topbar { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
    .topbar-left h2 { font-size: 18px; font-weight: 600; }
    .topbar-left .meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .topbar-right { display: flex; gap: 8px; }
    
    .content { flex: 1; overflow-y: auto; padding: 24px; }
    
    /* New PRD panel */
    .new-prd { max-width: 600px; }
    .new-prd textarea { width: 100%; min-height: 160px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; color: var(--text); font-size: 14px; resize: vertical; font-family: inherit; }
    .new-prd textarea:focus { outline: none; border-color: var(--primary); }
    .new-prd .fields { margin-top: 16px; display: flex; gap: 12px; }
    .new-prd input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 14px; color: var(--text); font-size: 14px; }
    .new-prd input:focus { outline: none; border-color: var(--primary); }
    
    /* Chat */
    .chat-area { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 8px 0; }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; }
    .msg.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .msg.assistant .avatar { background: var(--primary); }
    .msg.user .avatar { background: var(--surface2); }
    .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .msg.assistant .bubble { background: var(--surface); border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .chat-input { padding: 16px 0; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .chat-input textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; color: var(--text); font-size: 14px; resize: none; min-height: 48px; max-height: 120px; font-family: inherit; }
    .chat-input textarea:focus { outline: none; border-color: var(--primary); }
    .btn { padding: 10px 20px; border-radius: var(--r); font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: var(--surface2); color: var(--text); }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    /* Right panel */
    .right-panel { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .panel-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .panel-tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; }
    .panel-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .panel-content { flex: 1; overflow-y: auto; padding: 16px; }
    
    /* Artifacts */
    .artifact-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
    .artifact-card h4 { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
    .artifact-card pre { font-size: 12px; color: var(--text); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; font-family: 'Monaco', monospace; }
    
    /* Logs */
    .log-lines { font-family: 'Monaco', monospace; font-size: 12px; line-height: 1.8; }
    .log-line { display: block; }
    .log-ok { color: var(--success); }
    .log-err { color: var(--err); }
    .log-warn { color: var(--warn); }
    
    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty .icon { font-size: 48px; margin-bottom: 16px; }
    .empty h3 { font-size: 16px; color: var(--text); margin-bottom: 8px; }
    .empty p { font-size: 13px; }
    
    /* Progress bar */
    .progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.5s; }
    
    /* Stage action buttons */
    .stage-actions { display: flex; gap: 8px; margin-top: 16px; }
    
    .hidden { display: none !important; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
  </style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🚀 biz-delivery</h1>
      <div class="ver">v3.0 · 智能交付框架</div>
    </div>
    <nav class="sidebar-stages" id="stage-nav">
      <div class="stage-item" data-stage="learn" onclick="selectStage('learn')">
        <div class="stage-dot"></div><span>📚 Learn</span>
      </div>
      <div class="stage-item" data-stage="review" onclick="selectStage('review')">
        <div class="stage-dot"></div><span>🔍 Review</span>
      </div>
      <div class="stage-item" data-stage="td" onclick="selectStage('td')">
        <div class="stage-dot"></div><span>📋 TD</span>
      </div>
      <div class="stage-item" data-stage="tasks" onclick="selectStage('tasks')">
        <div class="stage-dot"></div><span>📝 Tasks</span>
      </div>
      <div class="stage-item" data-stage="agent" onclick="selectStage('agent')">
        <div class="stage-dot"></div><span>🤖 Agent</span>
      </div>
      <div class="stage-item" data-stage="test" onclick="selectStage('test')">
        <div class="stage-dot"></div><span>🧪 Test</span>
      </div>
      <div class="stage-item" data-stage="automation" onclick="selectStage('automation')">
        <div class="stage-dot"></div><span>⚡ Auto</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="model-badge" id="model-badge">
        <span>🤖</span><span id="model-name">agnes-2.0-flash</span>
        <span style="margin-left:auto;cursor:pointer" onclick="switchModelPrompt()" title="切换模型">⚙️</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h2 id="top-title">新建需求</h2>
        <div class="meta" id="top-meta">从零开始端到端交付流程</div>
      </div>
      <div class="topbar-right" id="top-actions">
        <button class="btn btn-primary btn-sm" id="btn-start" onclick="startNewSession()">✨ 开始交付</button>
      </div>
    </div>
    <div class="content" id="content">
      <!-- Dynamic content -->
    </div>
  </main>

  <!-- Right Panel -->
  <aside class="right-panel" id="right-panel">
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchPanel('result')">📄 产物</div>
      <div class="panel-tab" onclick="switchPanel('logs')">📋 日志</div>
    </div>
    <div class="panel-content" id="panel-result">
      <div class="empty"><div class="icon">📭</div><h3>等待执行</h3><p>选择阶段并运行后，产物将显示在这里</p></div>
    </div>
    <div class="panel-content hidden" id="panel-logs">
      <div class="log-lines" id="log-lines"></div>
    </div>
  </aside>
</div>

<script>
const API = '';
let session = null;
let currentStage = 'learn';
let pollTimer = null;

// ── Helpers ──
async function api(path, opts={}) {
  const res = await fetch(API + path, {headers:{'Content-Type':'application/json'}, ...opts});
  if(!res.ok) { const e = await res.json().catch(()=>({detail:res.statusText})); throw new Error(e.detail||res.statusText); }
  return res.json();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function now() { return new Date().toLocaleTimeString(); }

// ── New Session (PRD Input) ──
function showNewSession() {
  document.getElementById('content').innerHTML = `
    <div class="new-prd">
      <h3 style="margin-bottom:16px;">📋 输入 PRD 需求</h3>
      <textarea id="prd-text" placeholder="粘贴你的 PRD 内容...&#10;&#10;例如：为广告组模块新增素材审核功能，支持图片审核和文案审核两种模式..."></textarea>
      <div class="fields">
        <input type="text" id="proj-name" placeholder="需求名称（可选）" value="">
        <input type="text" id="proj-model" placeholder="LLM 模型" value="agnes-2.0-flash">
      </div>
      <div class="stage-actions">
        <button class="btn btn-primary" onclick="createSession()">🚀 创建并启动</button>
      </div>
    </div>`;
  document.getElementById('top-title').textContent = '新建需求';
  document.getElementById('top-meta').textContent = '填写 PRD，系统将自动编排全流程';
  document.getElementById('top-actions').innerHTML = '';
  clearRightPanel();
}

async function createSession() {
  const prd = document.getElementById('prd-text').value.trim();
  const name = document.getElementById('proj-name').value.trim() || '未命名需求';
  const model = document.getElementById('proj-model').value.trim() || 'agnes-2.0-flash';
  if (!prd) { alert('请填写 PRD 内容'); return; }
  
  try {
    session = await api('/api/session/start', {method:'POST', body: JSON.stringify({prd_text: prd, project_name: name})});
    window._currentModel = model;
    document.getElementById('model-name').textContent = model;
    showWorkspace();
  } catch(e) { alert('创建失败: ' + e.message); }
}

// ── Workspace ──
function showWorkspace() {
  document.getElementById('top-title').textContent = session.name;
  document.getElementById('top-meta').textContent = `🆔 ${session.project_id} · 🤖 ${session.model}`;
  document.getElementById('top-actions').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="runCurrentStage()">▶ 执行当前阶段</button>
    <button class="btn btn-primary btn-sm" onclick="autoRunAll()">⚡ 全量执行</button>`;
  renderChat();
  startPolling();
}

function renderChat() {
  const ct = document.getElementById('content');
  ct.innerHTML = `
    <div class="chat-area">
      <div class="chat-messages" id="chat-msgs"></div>
      <div class="chat-input">
        <textarea id="chat-in" placeholder="输入消息，按 Enter 发送..." rows="2"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="btn btn-primary" onclick="sendMsg()">发送</button>
      </div>
    </div>`;
  loadChat();
}

async function loadChat() {
  if (!session) return;
  try {
    const data = await api(`/api/session/chat/${currentStage}`);
    const container = document.getElementById('chat-msgs');
    if (!container) return;
    container.innerHTML = data.messages.map(m => `
      <div class="msg ${m.role}">
        <div class="avatar">${m.role==='user'?'👤':'🤖'}</div>
        <div class="bubble">${esc(m.content)}</div>
      </div>`).join('');
    container.scrollTop = container.scrollHeight;
  } catch{}
}

async function sendMsg() {
  const input = document.getElementById('chat-in');
  const msg = input.value.trim();
  if (!msg || !session) return;
  input.value = '';
  
  // Optimistic UI
  const container = document.getElementById('chat-msgs');
  container.innerHTML += `<div class="msg user"><div class="avatar">👤</div><div class="bubble">${esc(msg)}</div></div>`;
  container.scrollTop = container.scrollHeight;
  
  try {
    const resp = await api('/api/session/chat', {method:'POST', body: JSON.stringify({message: msg, stage: currentStage})});
    container.innerHTML += `<div class="msg assistant"><div class="avatar">🤖</div><div class="bubble">${esc(resp.reply)}</div></div>`;
    container.scrollTop = container.scrollHeight;
    updateStageUI();
    loadArtifacts();
  } catch(e) {
    container.innerHTML += `<div class="msg assistant"><div class="avatar">🤖</div><div class="bubble" style="color:var(--err)">❌ ${esc(e.message)}</div></div>`;
  }
}

// ── Stage Execution ──
async function runCurrentStage() {
  if (!session) return;
  setLoading(true);
  try {
    const result = await api(`/api/session/run-stage/${currentStage}`, {method:'POST'});
    addLog(`▶ ${currentStage}: ${result.status}`, result.status==='failed'?'err':'ok');
    updateStageUI();
    loadArtifacts();
    if (result.status === 'failed') addLog(`❌ ${currentStage} failed: ${result.error}`, 'err');
  } catch(e) {
    addLog(`❌ ${currentStage}: ${e.message}`, 'err');
  }
  setLoading(false);
}

async function autoRunAll() {
  if (!session) return;
  for (const stage of ['learn','review','td','tasks','agent','test','automation']) {
    currentStage = stage;
    updateSidebar();
    await runCurrentStage();
    if (session?.stages?.[stage]?.status === 'failed') break;
  }
  currentStage = session?.current_stage || 'learn';
  updateSidebar();
}

function setLoading(on) {
  document.querySelectorAll('.btn').forEach(b => b.disabled = on);
}

// ── Sidebar ──
function selectStage(stage) {
  currentStage = stage;
  updateSidebar();
  renderChat();
  loadArtifacts();
}

function updateSidebar() {
  document.querySelectorAll('.stage-item').forEach(el => {
    const s = el.dataset.stage;
    el.classList.remove('active','done','err');
    if (s === currentStage) el.classList.add('active');
  });
}

function updateStageUI() {
  // Update sidebar dots based on stage status
  fetch('/api/session/stages').then(r=>r.json()).then(data => {
    document.querySelectorAll('.stage-item').forEach(el => {
      const s = el.dataset.stage;
      el.classList.remove('done','err');
      const st = data.stages[s]?.status;
      if (st === 'completed') el.classList.add('done');
      if (st === 'failed') el.classList.add('err');
    });
    // Update progress in topbar
    fetch('/api/session/progress').then(r=>r.json()).then(p => {
      document.getElementById('top-meta').textContent = 
        `🆔 ${session?.project_id} · 🤖 ${window._currentModel} · ${p.completed}/${p.total} 阶段 · 当前: ${p.current_stage}`;
    });
  }).catch(()=>{});
}

// ── Right Panel ──
function switchPanel(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab==='result'?'产物':'日志')));
  document.getElementById('panel-result').classList.toggle('hidden', tab !== 'result');
  document.getElementById('panel-logs').classList.toggle('hidden', tab !== 'logs');
}

async function loadArtifacts() {
  const panel = document.getElementById('panel-result');
  try {
    const data = await api(`/api/artifacts/${currentStage}`);
    const arts = data.artifacts;
    if (!arts || Object.keys(arts).length === 0) {
      panel.innerHTML = `<div class="empty"><div class="icon">📭</div><h3>暂无产物</h3><p>${currentStage} 阶段尚未执行</p></div>`;
      return;
    }
    panel.innerHTML = Object.entries(arts).map(([name, content]) => `
      <div class="artifact-card">
        <h4>${esc(name)}</h4>
        <pre>${esc(content.substring(0, 2000))}${content.length>2000?'...':''}</pre>
      </div>`).join('');
  } catch(e) {
    panel.innerHTML = `<div class="empty"><div class="icon">⚠️</div><h3>加载失败</h3><p>${esc(e.message)}</p></div>`;
  }
}

function addLog(text, type='') {
  const el = document.getElementById('log-lines');
  if (!el) return;
  const cls = type==='err'?'log-err':type==='warn'?'log-warn':'log-ok';
  el.innerHTML += `<span class="log-line ${cls}">[${now()}] ${esc(text)}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function clearRightPanel() {
  document.getElementById('panel-result').innerHTML = '<div class="empty"><div class="icon">📭</div><h3>等待执行</h3><p>选择阶段并运行后，产物将显示在这里</p></div>';
  document.getElementById('log-lines').innerHTML = '';
}

// ── Model Switch ──
function switchModelPrompt() {
  const model = prompt('输入模型名称:', window._currentModel || 'agnes-2.0-flash');
  if (!model) return;
  const key = prompt('API Key（留空保持当前）:', '');
  const url = prompt('API URL（留空保持当前）:', '');
  api('/api/session/switch-model', {method:'POST', body: JSON.stringify({model, api_key: key||undefined, api_url: url||undefined})})
    .then(() => { window._currentModel = model; document.getElementById('model-name').textContent = model; })
    .catch(e => alert('切换失败: ' + e.message));
}

// ── Polling ──
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!session) return;
    updateStageUI();
    // Auto-refresh artifacts for running stages
    const stages = await api('/api/session/stages').catch(()=>null);
    if (stages?.stages?.[currentStage]?.status === 'completed') {
      loadArtifacts();
    }
  }, 3000);
}

// ── Init ──
showNewSession();
</script>
</body>
</html>
